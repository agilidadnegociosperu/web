name: Deploy Angular to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Improve ferretería images for high-DPI displays
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for img in \
            public/ferreterias/dueno-esclavo.webp \
            public/ferreterias/stock-desordenado.webp \
            public/ferreterias/ventas-perdidas.webp \
            public/ferreterias/compras-a-ciegas.webp
          do
            tmp="${img%.webp}.hq.webp"
            convert "$img" \
              -filter Lanczos \
              -resize 400% \
              -unsharp 0x0.75+0.60+0.02 \
              -strip \
              -quality 90 \
              "$tmp"
            mv "$tmp" "$img"
          done
      - run: npm install
      - run: npm run build
      - name: Prepare clean-route Pages artifact
        run: |
          touch dist/agne-web/browser/.nojekyll
          node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/agne-web/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
