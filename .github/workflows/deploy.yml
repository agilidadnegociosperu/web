name: Deploy Angular to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild and improve ferreteria images for high-DPI displays
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for name in dueno-esclavo stock-desordenado ventas-perdidas compras-a-ciegas
          do
            src="public/ferreterias/${name}.source.webp"
            out="public/ferreterias/${name}.webp"
            cat public/ferreterias/.parts/${name}.*.b64 | tr -d '\r\n' | base64 --decode > "$src"
            identify "$src"
            convert "$src" \
              -filter Lanczos \
              -resize 600% \
              -unsharp 0x0.75+0.55+0.02 \
              -strip \
              -quality 90 \
              "$out"
            identify "$out"
            rm "$src"
          done
      - run: npm install
      - run: npm run build
      - name: Prepare clean-route Pages artifact
        run: |
          touch dist/agne-web/browser/.nojekyll
          node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/agne-web/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
